name: 'Execute Stack deploy'
description: 'Deploy a Stack project'
inputs:
  git-repo:
    description: The git repo to clone
    required: true
  git-ref:
    description: Commit ref to check out (typically a hash)
    required: true
  docker-image:
    description: Full path to Docker image to deploy
    required: true
  project:
    description: 'Project name as specified in the deploy.yml configuration'
    required: true
  release-id:
    description: 'Name of the release (typically a date and commit hash)'
    required: false
  pods:
    description: 'Space-separated list of pods to deploy'
    required: false
  excluded-pods:
    description: 'Space-separated list of pods to exclude (mutually exclusive with `pods`)'
    required: false
  stack-version:
    description: 'Pin a specific Stack release tag (e.g. v1.2.3 or v1.2.3-pre1). Defaults to latest stable.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Install stack
      id: install
      shell: bash
      env:
        STACK_VERSION: ${{ inputs.stack-version }}
      run: |
        if [ -n "$STACK_VERSION" ]; then
          # Pinned: download the requested binary to a user-writable location
          # so we don't need sudo (some runner images don't allow passwordless
          # sudo) and so we override any pre-installed /usr/local/bin/stack.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/merkle-team/stack/releases/download/${STACK_VERSION}/stack" \
            -o "$HOME/.local/bin/stack"
          chmod +x "$HOME/.local/bin/stack"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stack" --version
        else
          # Unpinned: install latest stable via the upstream installer if
          # not already present.
          if ! which stack >/dev/null; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/merkle-team/stack/refs/heads/main/install.sh)"
          fi
          stack --version
        fi

    - name: Set release ID
      id: set-release
      shell: bash
      env:
        RELEASE_ID: ${{ inputs.release-id }}
        GIT_REF: ${{ inputs.git-ref }}
      run: |
        if [ -z "$RELEASE_ID" ]; then
          release="$(date -u +"%Y-%m-%dT%H-%M-%S-%3NZ")-${GIT_REF}"
        else
          release="$RELEASE_ID"
        fi
        if [[ ! "$release" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::Invalid release ID: only letters, digits, '.', '_' and '-' are allowed"
          exit 1
        fi
        echo "release = $release"
        echo "release=$release" >> "$GITHUB_OUTPUT"

    # Clone just the Stack deploy configuration.
    # We do this here instead of on the deployer since the GitHub Actions runner already has SSH permissions configured
    - name: Clone deploy configuration
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.git-repo }}
        ref: ${{ inputs.git-ref }}
        clean: false # Reuse previously installed Terraform plugins
        sparse-checkout: |
          .stack

    - name: Copy configuration to temp directory that gets reused between deploys
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        if [[ ! "$PROJECT" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::Invalid project name"
          exit 1
        fi
        mkdir -p "$HOME/${PROJECT}-deployer"
        rm -rf "$HOME/${PROJECT}-deployer/.stack"
        cp -R .stack "$HOME/${PROJECT}-deployer/.stack"

    - name: Deploy the ${{ inputs.project }} stack
      shell: bash
      # Inputs reach the script only through env vars, never through ${{ }} in
      # the script text, so a crafted pod name can't inject shell commands.
      env:
        PROJECT: ${{ inputs.project }}
        RELEASE: ${{ steps.set-release.outputs.release }}
        DOCKER_IMAGE: ${{ inputs.docker-image }}
        PODS: ${{ inputs.pods }}
        EXCLUDED_PODS: ${{ inputs.excluded-pods }}
      run: |
        set -euo pipefail
        set -f # no glob expansion when splitting pod lists

        name_re='^[A-Za-z0-9._-]+$'
        if [[ ! "$PROJECT" =~ $name_re ]]; then
          echo "::error::Invalid project name"
          exit 1
        fi
        if [[ ! "$DOCKER_IMAGE" =~ ^[A-Za-z0-9._:/@-]+$ ]]; then
          echo "::error::Invalid docker image"
          exit 1
        fi

        args=(deploy --yes "--release=$RELEASE")
        for pod in $PODS; do
          if [[ ! "$pod" =~ $name_re ]]; then
            echo "::error::Invalid pod name in pods input"
            exit 1
          fi
          args+=("pod:$pod")
        done
        for pod in $EXCLUDED_PODS; do
          if [[ ! "$pod" =~ $name_re ]]; then
            echo "::error::Invalid pod name in excluded-pods input"
            exit 1
          fi
          args+=("pod:-$pod")
        done

        cd "$HOME/${PROJECT}-deployer"
        STACK_DOCKER_IMAGE="$DOCKER_IMAGE" CI=true stack "${args[@]}"
